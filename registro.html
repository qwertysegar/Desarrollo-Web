<!DOCTYPE html>
<link rel="stylesheet" href="registro.css">
</head>
<body>


<header class="header">
<h1 class="logo">Sistema de Eventos</h1>
<nav class="nav">
<a href="index.html">Inicio</a>
<a class="activo" href="registro.html">Registrar Participante</a>
<a href="participantes.html">Ver Participantes</a>
</nav>
</header>


<main class="container">


<form class="form-registro">


<h2>Registro de Participante</h2>


<!-- Selección de evento -->
<label>Evento</label>
<select required>
<option>Selecciona un evento</option>
<option>Conferencia Web 2025</option>
</select>


<!-- Tipo de participante -->
<label>Tipo de participante</label>
<select required>
<option>Asistente</option>
<option>Ponente</option>
</select>


<!-- Campos comunes -->
<label>Nombre completo *</label>
<input type="text" required>


<label>Email *</label>
<input type="email" required>


<label>Teléfono</label>
<input type="tel">


<label>Empresa / Institución</label>
<input type="text">


<label>País / Ciudad</label>
<input type="text">


<!-- Campos específicos (solo visuales) -->
<fieldset>
<legend>Datos adicionales (según tipo)</legend>
<input type="text" placeholder="Nivel de experiencia / Título de ponencia">
<input type="text" placeholder="Áreas de interés / Duración">
<textarea placeholder="Biografía o requerimientos técnicos"></textarea>
</fieldset>


<!-- Acciones -->
<div class="acciones">
<button type="submit">Registrar</button>
<button type="reset">Cancelar</button>
<a href="participantes.html">Ver participantes registrados</a>
</div>


</form>


</main>


</body>
</html>
